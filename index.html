:root{--bg:#eef1f6;--panel:#fff;--text:#16202c;--muted:#5f6e82;--line:#dde4ee;--accent:#1f6feb;--bad:#d93838}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1219;--panel:#151d27;--text:#e7eef7;--muted:#93a4b8;--line:#242f3d;--accent:#4d94ff;--bad:#ff6b6b}}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);

form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:360px;text-align:center}
input{width:100%;font:inherit;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:center}
button{width:100%;margin-top:10px;font:inherit;font-size:16px;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff}
label{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pass){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},k,b64(DATA.ct));
  const html=new TextDecoder().decode(plain);
  // صفحه‌ی باز شده در یک Blob URL، مثل یک صفحه‌ی عادی بار می‌شود (اسکریپت‌ها، localStorage و میکروفون درست کار می‌کنند)
  location.replace(URL.createObjectURL(new Blob([html],{type:'text/html'})));
}
async function tryOpen(pass,quiet){
  try{await open(pass);return true}
  catch(e){if(!quiet)document.getElementById('msg').textContent='رمز درست نیست';return false}
}
let saved='';try{saved=localStorage.getItem('ic_pass')||''}catch(e){}
if(saved)tryOpen(saved,true).then(ok=>{if(!ok)try{localStorage.removeItem('ic_pass')}catch(e){}});
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('p').value;
  if(document.getElementById('r').checked)try{localStorage.setItem('ic_pass',p)}catch(e){}
  if(!await tryOpen(p))try{localStorage.removeItem('ic_pass')}catch(e){}};
</script>
